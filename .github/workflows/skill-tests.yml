name: Skill tests

on:
  pull_request:
    paths:
      - "README.md"
      - "skills/chanlun-skill/**"
      - ".github/workflows/skill-tests.yml"
  push:
    paths:
      - "README.md"
      - "skills/chanlun-skill/**"
      - ".github/workflows/skill-tests.yml"
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Install pinned runtime dependencies
        run: python -m pip install -r skills/chanlun-skill/scripts/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r skills/chanlun-skill/tests/requirements.txt
      - name: Run offline test suite
        shell: pwsh
        run: |
          Push-Location skills/chanlun-skill
          python tests/unit/test_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/integration/golden_regression.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/integration/gray_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/integration/test_data_loader.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/integration/test_rust_adapter.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }